name: Fetch + Build + Deploy (GitHub Pages)

on:
  schedule:
    # 12:00 UTC = 19:00 น. ไทย (ICT = UTC+7) ของวันที่ 2 และ 17
    # เลือกวันรองจากงวด (1/16) เพื่อให้ myhora อัปเดตผลแล้วแน่นอน
    - cron: "0 12 2,17 * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch latest lottery results
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bun run fetch

      - name: Commit new data (if any)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/lottery-results.json
          if git diff --cached --quiet; then
            echo "ไม่มีงวดใหม่ — ข้ามการ commit"
          else
            git commit -m "chore(data): เพิ่มงวดใหม่จาก myhora [skip ci]"
            git push
          fi

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build
        env:
          VITE_BASE: /lpa/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
