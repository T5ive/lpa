<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="วิเคราะห์เลขวนหวยรัฐบาลไทยย้อนหลัง ดูเลขซ้ำระหว่างงวด เปรียบเทียบทุกงวด เข้าใจง่ายในหน้าเดียว"
    />
    <title>หวยวน | วิเคราะห์เลขย้อนหลัง</title>
    <script>
      // ตั้งค่าธีมก่อนเรนเดอร์เพื่อไม่ให้กระพริบ (flash of wrong theme)
      try {
        var t = localStorage.getItem("lpa-theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
